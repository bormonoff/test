name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: gen token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - run: |
          git config user.name "ge-b4n-ci[bot]"
          git config user.email "my-bot[bot]@users.noreply.github.com"

          sed -i "s|bormonoff/bridge-api:.*|bormonoff/bridgeapi:${{ github.ref_name }}|g" docker-compose.yml

          git add .
          git commit -m "Auto-generated changes" || exit 0
          git push